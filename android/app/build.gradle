apply plugin: 'com.android.application'

// Release signing (judges' APK): the keystore lives OUTSIDE the repo
// (~/.android/codeher-release.jks) with credentials in
// android/local.properties (gitignored). Evaluated for every build but only
// applied to the release type when a key exists, so fresh clones and debug
// builds never break for lack of a key. Unsigned release builds cannot be
// installed; create both per README before releasing.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { stream -> localProps.load(stream) }
}
def keystorePath = localProps['codeher.keystore.path']?.toString()
def hasSigningKey = keystorePath != null && file(keystorePath).exists()

android {
    namespace = "com.codeher.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.codeher.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0-alpha"
        // Build identity stamp, visible in Settings → About and logcat.
        // Regenerated every build so on-phone builds are always identifiable.
        buildConfigField "String", "BUILD_TAG", "\"" + new Date().format('yyyyMMdd-HHmm') + "\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningKey) {
                storeFile file(keystorePath)
                storePassword localProps['codeher.keystore.password'].toString()
                keyAlias localProps['codeher.key.alias'].toString()
                keyPassword localProps['codeher.key.password'].toString()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // On-device keyword spotting (codeHER.md §3). Model in
    // app/src/main/assets/model-en-us (git-ignored, see README to fetch).
    // Latest verified 2026-10-09; check Maven Central for newer.
    implementation 'com.alphacephei:vosk-android:0.3.75'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
